<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
      .pulse-circle { animation: pulse 3s infinite ease-in-out; transform-origin: center; }
      .float-card { animation: float 4s infinite ease-in-out; }
      .dash-flow { stroke-dasharray: 10, 10; animation: dash 20s linear infinite; }
      @keyframes pulse { 0% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.15); opacity: 0.8; } 100% { transform: scale(1); opacity: 0.4; } }
      @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
      @keyframes dash { to { stroke-dashoffset: -200; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Decorative Glowing Circles -->
  <circle cx="150" cy="100" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-circle"/>
  <circle cx="1050" cy="300" r="220" fill="#a855f7" opacity="0.15" filter="url(#glow)" class="pulse-circle" style="animation-delay: 1.5s;"/>

  <!-- Flow Diagrams / Connecting Lines -->
  <path d="M 150 250 Q 300 120 450 250 T 750 250 T 1050 250" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" class="dash-flow"/>
  <path d="M 200 150 Q 500 320 800 150 T 1100 200" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.3" class="dash-flow" style="animation-duration: 15s;"/>

  <!-- Main Content Card -->
  <g transform="translate(80, 50)" class="float-card">
    <rect width="1040" height="300" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Header Icon / Emoji Graphic -->
    <g transform="translate(50, 45)">
      <rect width="64" height="64" rx="14" fill="#3b82f6" opacity="0.2"/>
      <text x="32" y="44" font-size="34" text-anchor="middle">📦</text>
    </g>

    <!-- Title and Subtitle -->
    <text x="135" y="80" class="title">Awesome Purchase Order Management 🛒</text>
    <text x="135" y="115" class="subtitle">Curated SaaS Platforms &amp; Open-Source Procure-to-Pay Ecosystem</text>

    <!-- Feature Pill Badges -->
    <g transform="translate(50, 160)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="44" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="25" y="27" class="badge-text">📋 Purchase Requisitions</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(225, 0)">
        <rect width="190" height="44" rx="22" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
        <text x="25" y="27" class="badge-text">⚡ Approval Workflows</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(430, 0)">
        <rect width="170" height="44" rx="22" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
        <text x="25" y="27" class="badge-text">📊 Spend Control</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(615, 0)">
        <rect width="210" height="44" rx="22" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
        <text x="25" y="27" class="badge-text">🤝 Supplier Coordination</text>
      </g>
    </g>

    <!-- Sub-footer stats / tags inside card -->
    <g transform="translate(50, 240)">
      <text font-family="system-ui, sans-serif" font-size="14" fill="#64748b">
        <tspan fill="#38bdf8">●</tspan> 9 SaaS Leaders Evaluated &nbsp;&nbsp;&nbsp;&nbsp;
        <tspan fill="#a855f7">●</tspan> Best Open-Source ERP Modules &nbsp;&nbsp;&nbsp;&nbsp;
        <tspan fill="#4ade80">●</tspan> Star Ratings &amp; Pricing Benchmarks
      </text>
    </g>
  </g>
</svg>

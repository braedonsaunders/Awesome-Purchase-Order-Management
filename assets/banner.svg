<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#textGrad);
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 15px;
        fill: #f8fafc;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .float-card {
        animation: float 4s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 10, 10;
        animation: dash 20s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.2; }
        100% { transform: scale(1.1); opacity: 0.5; }
      }
      @keyframes float {
        0% { transform: translate(80px, 50px); }
        100% { transform: translate(80px, 40px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Animated Glowing Circles -->
  <circle cx="150" cy="100" r="160" fill="#6366f1" opacity="0.3" class="pulse-circle"/>
  <circle cx="1050" cy="300" r="180" fill="#a855f7" opacity="0.3" class="pulse-circle" style="animation-delay: -2s;"/>

  <!-- Flow Diagrams / Connecting Lines -->
  <path d="M 150 250 Q 300 120 450 250 T 750 250 T 1050 250" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" class="dash-flow"/>
  <path d="M 200 150 Q 500 320 800 150 T 1100 200" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.3" class="dash-flow" style="animation-duration: 15s;"/>

  <!-- Main Content Card -->
  <g class="float-card">
    <rect width="1040" height="300" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Icon Graphic -->
    <g transform="translate(45, 40)">
      <rect width="64" height="64" rx="14" fill="#3b82f6" opacity="0.2"/>
      <!-- SVG Box / Package Graphic -->
      <path d="M 16 22 L 32 12 L 48 22 L 48 42 L 32 52 L 16 42 Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 16 22 L 32 32 L 48 22" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 32 32 L 32 52" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- Title and Subtitle -->
    <text x="130" y="78" class="title">Awesome Purchase Order Management</text>
    <text x="130" y="112" class="subtitle">Curated SaaS Platforms &amp; Open-Source Procure-to-Pay Ecosystem</text>

    <!-- Feature Pill Badges -->
    <g transform="translate(45, 155)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="44" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="25" y="27" class="badge-text">Purchase Requisitions</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(225, 0)">
        <rect width="190" height="44" rx="22" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
        <text x="25" y="27" class="badge-text">Approval Workflows</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(430, 0)">
        <rect width="170" height="44" rx="22" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
        <text x="25" y="27" class="badge-text">Spend Control</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(615, 0)">
        <rect width="210" height="44" rx="22" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
        <text x="25" y="27" class="badge-text">Supplier Coordination</text>
      </g>
    </g>

    <!-- Sub-footer tags inside card -->
    <g transform="translate(45, 245)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
        <tspan fill="#38bdf8">●</tspan> 9 SaaS Leaders Evaluated &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <tspan fill="#a855f7">●</tspan> Best Open-Source ERP Modules &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <tspan fill="#4ade80">●</tspan> Star Ratings &amp; Pricing Benchmarks
      </text>
    </g>
  </g>
</svg>
